<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chat Widget — Host Site Demo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 40px; background: #f9fafb; color: #111827;
    }
    h1 { margin: 0 0 12px; }
    p  { max-width: 640px; line-height: 1.6; color: #4b5563; }
    .card {
      background: white; border: 1px solid #e5e7eb;
      border-radius: 12px; padding: 24px; max-width: 640px;
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }
    button.demo {
      padding: 8px 14px; border-radius: 8px; border: 1px solid #d1d5db;
      background: white; cursor: pointer; margin-right: 8px;
    }
    button.demo:hover { background: #f3f4f6; }
    code {
      background: #f3f4f6; padding: 2px 6px; border-radius: 4px;
      font-size: 13px;
    }
    #boot-status {
      margin-top: 12px; font-size: 12px; color: #6b7280;
    }
    #boot-status[data-state="error"] { color: #b91c1c; }
    #boot-status[data-state="ok"]    { color: #047857; }
  </style>
</head>
<body>
  <div class="card">
    <div id="boot-status"></div>
  </div>

  <script
    src="../dist/chat-widget.js"
    onload="window.__widgetLoaded = true; window.dispatchEvent(new Event('widget-script-loaded'))"
    onerror="document.getElementById('boot-status').textContent='Failed to load chat-widget.js (404?)'; document.getElementById('boot-status').setAttribute('data-state','error')"
  ></script>

  <script>
    async function boot() {
      const status = document.getElementById('boot-status');

      if (typeof ChatWidget === 'undefined') {
        status.textContent = 'ChatWidget not defined — chat-widget.js failed to load.';
        status.setAttribute('data-state', 'error');
        return;
      }

      try {
        status.textContent = 'Initializing widget…';

        await ChatWidget.init({
          appId: 'demo-app',
          userId: 'demo-user',       // not used in login flow
          // No `token` provided → widget shows login form.
          allowLogin: true,
          tenantSlug: 'default',
          apiBaseUrl: 'http://localhost:3000',
          theme: 'auto',
          position: 'bottom-right',
          primaryColor: '#6366f1',
          features: {
            chat: true,
            messageReaction: true,
            messageReply: true,
            messageDelete: true,
          },
        });

        ChatWidget.on('authenticated', (p) => {
          console.log('[demo] authenticated', p);
          status.textContent = 'Authenticated — click the bubble (bottom-right).';
          status.setAttribute('data-state', 'ok');
        });
        ChatWidget.on('needsAuth', () => {
          status.textContent = 'Please sign in using the widget form.';
          status.setAttribute('data-state', 'ok');
        });
        ChatWidget.on('ready', (p) => console.log('[demo] ready', p));
        ChatWidget.on('message', (m) => console.log('[demo] message', m));
        ChatWidget.on('error', (e) => console.error('[demo] error', e));

        // Auto-open the widget so the login form is immediately visible.
        ChatWidget.open();
      } catch (err) {
        console.error('[demo] init failed', err);
        status.textContent = 'Init failed: ' + (err && err.message ? err.message : err);
        status.setAttribute('data-state', 'error');
      }
    }

    if (window.__widgetLoaded) {
      window.addEventListener('DOMContentLoaded', boot);
    } else {
      window.addEventListener('widget-script-loaded', () => {
        if (document.readyState === 'loading') {
          window.addEventListener('DOMContentLoaded', boot, { once: true });
        } else {
          boot();
        }
      });
    }
  </script>
</body>
</html>
